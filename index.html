<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Scan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ID Scan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#148BD8">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #F2FAFD; --card: #ffffff; --ink: #1b1523; --muted: #6b6577;
    --purple: #148BD8; --purple-dark: #0671B8; --line: #D0E8EF;
    --ok: #188038; --err: #d93025; --warn: #b06000;
  }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0;
    background: var(--bg); color: var(--ink); }
  /* Ba phần theo chiều dọc: trên (trống) | giữa (cả cụm nội dung, luôn ở giữa màn hình) | dưới (danh sách quét) */
  .screen { min-height: 100vh; min-height: 100dvh; max-width: 520px; margin: 0 auto; padding: 16px;
    display: flex; flex-direction: column; }
  .top { flex: 1 1 0; min-height: 0; }
  .stage { flex: none; width: 100%; }
  .bottom { flex: 1 1 0; min-height: 0; overflow-y: auto; }
  [hidden] { display: none !important; }
  body:not(.in) .bottom { visibility: hidden; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }

  .brand { text-align: center; padding: 0 0 8px; }
  .brand img { display: block; margin: 0 auto; width: 170px; max-width: 55%; height: auto; }
  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 18px 0 24px; letter-spacing: .2px; }

  .btn { display: block; width: 100%; padding: 22px; font-size: 24px; font-weight: 700; border: 0;
    border-radius: 14px; margin-bottom: 12px; text-align: center; cursor: pointer;
    background: var(--purple); color: #fff; }
  .btn:active { background: var(--purple-dark); }
  .btn:disabled { background: #a59fb0; cursor: default; }
  .btn.small { font-size: 20px; padding: 16px; }

  input[type=text], input[type=email] { width: 100%; padding: 16px; font-size: 20px;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; background: #fff; color: var(--ink); }
  #otp { letter-spacing: 8px; text-align: center; font-size: 26px; }

  #bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px;
    color: var(--muted); margin-bottom: 0; }
  #who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px;
    padding: 6px 12px; font-size: 14px; cursor: pointer; flex: none; }

  #status { text-align: center; font-size: 17px; font-weight: 600; min-height: 24px; margin: 10px 0 4px; }
  #loginView { position: relative; margin-bottom: -12px; } /* bù khoảng cách dưới nút cuối để cụm nằm đúng giữa */
  #loginMsg { position: absolute; left: 0; right: 0; top: 100%; padding-top: 10px;
    text-align: center; font-size: 17px; font-weight: 600; }
  #counter { text-align: center; font-size: 15px; margin: 4px 0 14px; color: var(--muted); font-weight: 600; }
  .ok { color: var(--ok); } .err { color: var(--err); } .wait { color: var(--purple); } .dupc { color: var(--warn); }

  #list { margin: 0; padding: 14px 0 0; list-style: none; }
  #list li { background: var(--card); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    font-size: 15px; word-break: break-word; border-left: 5px solid #9aa0a6; }
  #list li.ok { border-left-color: var(--ok); }
  #list li.err { border-left-color: var(--err); }
  #list li.wait { border-left-color: var(--purple); }
  #list li.dup { border-left-color: #f9ab00; }
  #list small { display: block; color: var(--muted); margin-top: 2px; }
  #list li.err small { color: var(--err); }
  .mini { margin-top: 6px; margin-right: 6px; padding: 6px 12px; font-size: 14px; border: 0;
    border-radius: 6px; background: #ebe7f1; cursor: pointer; }
</style>
</head>
<body>

<div class="screen">
  <!-- Hàng trên: để trống, giữ cho cụm giữa nằm đúng giữa màn hình -->
  <div class="top"></div>

  <!-- Hàng giữa: cả cụm (logo, tiêu đề, nút, bộ đếm, email + đăng xuất) nằm giữa màn hình -->
  <main class="stage">
    <section id="setupView" style="display:none">
      <h1>Thiết lập ID Scan</h1>
      <p style="text-align:center;color:var(--muted);font-size:15px">Nhập tên công ty và đường dẫn Google Sheets trong lần đầu sử dụng.</p>
      <input type="text" id="companyInput" placeholder="Tên công ty" maxlength="150" autocomplete="organization">
      <input type="text" id="sheetInput" placeholder="https://docs.google.com/spreadsheets/d/..." inputmode="url">
      <input type="text" id="setupPinInput" placeholder="Mã thiết lập do quản trị viên cung cấp" autocomplete="off">
      <button class="btn small" id="btnSetup">Khởi tạo và tiếp tục</button>
      <div id="setupMsg" role="status" style="text-align:center;font-weight:600"></div>
      <p style="font-size:13px;color:var(--muted)">Google Sheet phải được cấp quyền chỉnh sửa cho tài khoản triển khai Apps Script. Không nhập mã quản trị nếu chưa được cấp phép.</p>
    </section>
    <header class="brand">
  <img src="brand.svg" alt="ID Scan">
</header>

    <!-- Màn hình đăng nhập -->
    <div id="loginView" style="display:none">
      <h1 id="loginTitle">ID Scan</h1>
      <input type="email" id="email" placeholder="Email được cấp quyền" autocomplete="email">
      <button class="btn small" id="btnSendOtp">Gửi mã OTP</button>
      <div id="otpBox" style="display:none">
        <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="Mã 6 số" autocomplete="one-time-code">
        <button class="btn small" id="btnVerify">Xác nhận</button>
      </div>
      <div id="loginMsg"></div>
      <p style="text-align:center;margin-top:25px"><button id="btnChangeCompany" style="border:0;background:transparent;color:#1379BB;text-decoration:underline;font-size:14px">Đổi cấu hình công ty</button></p>
    </div>

    <!-- Màn hình chính sau đăng nhập -->
    <div id="appView" style="display:none">
      <h1>Quét thẻ định danh</h1>
      <div id="companyLabel" style="text-align:center;color:var(--muted);font-weight:600;margin-top:-15px;margin-bottom:18px"></div>
      <button class="btn" id="btnScan">Scan QR</button>
      <input type="file" accept="image/*" capture="environment" id="file" hidden>
      <div id="status"></div>
      <div id="counter"></div>
      <div id="bar"><span id="who"></span><button id="btnLogout">Đăng xuất</button></div>
    </div>
  </main>

  <!-- Hàng dưới: danh sách các thẻ vừa quét (cuộn được, không làm lệch cụm giữa) -->
  <div class="bottom">
    <ul id="list"></ul>
  </div>
</div>
<div id="readerFile" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script src="config.js"></script>
<script>
  const FIELD_COUNT = 7;
  const DATE_FIELDS = [4, 7];
  const MAX_PARALLEL = 2;         // số mã gửi đồng thời
  const TIMEOUT_MS = 40000;       // quá thời gian này coi như lỗi
  const LS_TENANT = 'idscan_tenant_v2', LS_COMPANY = 'idscan_company_v2';
  let tenantId = '', companyName = '';
  const LS_TOKEN = 'idescan_token', LS_EMAIL = 'idescan_email';

  const $ = id => document.getElementById(id);
  let token = '', userEmail = '';
  let photoBusy = false;
  let queue = [], nextId = 1, active = 0, savedCount = 0, dupCount = 0;
  let sessionKeys = new Set();
  let audioCtx = null;

  // ---------- Lưu trữ cục bộ ----------
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function apiReady() {
    return typeof API_URL === 'string' && API_URL.indexOf('https://') === 0;
  }

  function errText(e) {
    if (e && e.name === 'ConfigError') return e.message;
    return 'Lỗi kết nối, hãy thử lại. (' + (e && e.message ? e.message : e) + ')';
  }

  async function api(body, timeout) {
    if (!apiReady()) {
      const ce = new Error('Chưa cấu hình URL Apps Script. Hãy dán URL vào tệp config.js rồi cài lại app.');
      ce.name = 'ConfigError';
      throw ce;
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout || TIMEOUT_MS);
    try {
      if (body.action !== 'setup') body.tenantId = tenantId;
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal });
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  function showSetup(msg) {
    document.body.classList.remove('in');
    $('setupView').style.display='block'; $('loginView').style.display='none'; $('appView').style.display='none';
    $('setupMsg').textContent = msg || '';
  }
  async function doSetup() {
    const company=$('companyInput').value.trim();
    const sheetUrl=$('sheetInput').value.trim();
    const setupPin=$('setupPinInput').value;
    if(!company || !sheetUrl || !setupPin) { $('setupMsg').textContent='Hãy nhập đủ thông tin.'; return; }
    $('btnSetup').disabled=true; $('setupMsg').textContent='Đang thiết lập...';
    try {
      const r=await api({action:'setup',company,sheetUrl,setupPin},60000);
      if(!r.ok) throw new Error(r.error || 'Không thể thiết lập');
      tenantId=r.tenantId; companyName=r.company;
      lsSet(LS_TENANT,tenantId); lsSet(LS_COMPANY,companyName);
      $('setupPinInput').value=''; $('setupView').style.display='none';
      showLogin('Đã khởi tạo thành công. Hãy đăng nhập bằng OTP.','ok');
    } catch(e) { $('setupMsg').textContent=errText(e); }
    finally { $('btnSetup').disabled=false; }
  }
  // ---------- Đăng nhập ----------
  function loginMsg(t, cls) { $('loginMsg').textContent = t; $('loginMsg').className = cls || ''; }

  function showLogin(msg, cls) {
    document.body.classList.remove('in');
    $('setupView').style.display='none';
    $('appView').style.display = 'none';
    $('loginView').style.display = 'block';
    $('loginTitle').textContent=companyName || 'ID Scan';
    $('otpBox').style.display = 'none';
    $('otp').value = '';
    if (userEmail) $('email').value = userEmail;
    loginMsg(msg || '', cls);
  }

  function showApp() {
    document.body.classList.add('in');
    $('loginView').style.display = 'none';
    $('appView').style.display = 'block';
    $('companyLabel').textContent=companyName;
    $('who').textContent = userEmail;
    render();
  }

  async function sendOtp() {
    const em = $('email').value.trim().toLowerCase();
    if (!em) { loginMsg('Hãy nhập email.', 'err'); return; }
    $('btnSendOtp').disabled = true;
    loginMsg('Đang gửi mã...', 'wait');
    try {
      const r = await api({ action: 'requestOtp', email: em }, 30000);
      if (r.ok) {
        userEmail = em;
        $('otpBox').style.display = 'block';
        loginMsg('Đã gửi mã 6 số tới ' + em + '. Hãy kiểm tra hộp thư (cả thư rác).', 'ok');
        $('otp').focus();
      } else loginMsg(r.error || 'Không gửi được mã.', 'err');
    } catch (e) { loginMsg(errText(e), 'err'); }
    $('btnSendOtp').disabled = false;
  }

  async function verifyOtp() {
    const code = $('otp').value.trim();
    if (code.length < 6) { loginMsg('Hãy nhập đủ 6 số.', 'err'); return; }
    $('btnVerify').disabled = true;
    loginMsg('Đang xác nhận...', 'wait');
    try {
      const r = await api({ action: 'verifyOtp', email: userEmail, otp: code }, 30000);
      if (r.ok) {
        token = r.token; userEmail = r.email;
        lsSet(LS_TOKEN, token); lsSet(LS_EMAIL, userEmail);
        showApp();
        pump();
      } else loginMsg(r.error || 'Mã OTP không đúng.', 'err');
    } catch (e) { loginMsg(errText(e), 'err'); }
    $('btnVerify').disabled = false;
  }

  function logout() {
    token = ''; lsSet(LS_TOKEN, '');
    status('');
    showLogin('Đã đăng xuất.', 'ok');
  }

  function authLost() {
    token = ''; lsSet(LS_TOKEN, '');
    queue.forEach(it => {
      if (it.state === 'wait') { it.state = 'err'; it.msg = 'Chưa gửi do hết phiên đăng nhập. Hãy đăng nhập lại rồi bấm Thử lại.'; }
    });
    showLogin('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.', 'err');
  }

  // ---------- Kiểm tra dữ liệu mã QR ----------
  function parse(text) {
    const seps = ['\n', '\t', '|', ';', ','];
    for (const s of seps) {
      const p = text.split(s).map(x => x.trim());
      if (p.length >= FIELD_COUNT) return p.slice(0, FIELD_COUNT);
    }
    return null;
  }

  function validDate(s) {
    s = String(s).trim();
    const m = s.match(/^(\d{2})(\d{2})(\d{4})$/) || s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (!m) return false;
    const d = +m[1], mo = +m[2], y = +m[3];
    const dt = new Date(y, mo - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
  }

  function keyOf(f) { return f.map(x => x.toUpperCase()).join('\u0001'); }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 1000; g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(120);
  }

  function status(text, cls) { $('status').textContent = text; $('status').className = cls || ''; }

  // ---------- Danh sách và trạng thái ----------
  function render() {
    const pending = queue.filter(x => x.state === 'wait' || x.state === 'send').length;
    const items = queue.slice(-10).reverse();
    $('list').innerHTML = items.map(it => {
      const cls = it.state === 'send' ? 'wait' : it.state;
      const where = (it.sheet ? 'sheet ' + it.sheet + ', ' : '') + 'dòng ' + it.row;
      const label = it.state === 'ok' ? '✔ Đã lưu (' + where + ')'
                  : it.state === 'dup' ? '⚠ Đã có trong Google Sheet (' + where + '), không ghi lại'
                  : (it.state === 'wait' || it.state === 'send') ? '⏳ Đang lưu...'
                  : '✘ ' + esc(it.msg);
      let btns = '';
      if (it.state === 'err') {
        btns = '<br><button class="mini" data-act="retry" data-id="' + it.id + '">Thử lại</button>' +
               '<button class="mini" data-act="drop" data-id="' + it.id + '">Bỏ</button>';
      }
      return '<li class="' + cls + '"><b>' + esc(it.f[0]) + '</b> | ' + esc(it.f[1]) +
             ' | ' + esc(it.f[3]) + '<small>' + label + '</small>' + btns + '</li>';
    }).join('');
    $('counter').textContent = 'Đang lưu: ' + pending + '  |  Đã lưu: ' + savedCount + '  |  Trùng bỏ qua: ' + dupCount;
  }

  // ---------- Gửi dữ liệu ----------
  function pump() {
    if (!token) return;
    while (active < MAX_PARALLEL) {
      const it = queue.find(x => x.state === 'wait');
      if (!it) return;
      send(it);
    }
  }

  async function send(it) {
    it.state = 'send'; active++; render();
    try {
      const r = await api({ action: 'save', token: token, fields: it.f });
      if (r.ok && r.duplicate) { it.state = 'dup'; it.row = r.row; it.sheet = r.sheet; dupCount++; }
      else if (r.ok) { it.state = 'ok'; it.row = r.row; it.sheet = r.sheet; savedCount++; }
      else if (r.auth === false) { it.state = 'err'; it.msg = 'Hết phiên đăng nhập. Hãy đăng nhập lại rồi bấm Thử lại.'; authLost(); }
      else { it.state = 'err'; it.msg = 'Lưu thất bại: ' + r.error; }
    } catch (e) {
      it.state = 'err';
      it.msg = e.name === 'AbortError'
        ? 'Quá thời gian chờ. Bấm Thử lại (hệ thống tự bỏ qua nếu dữ liệu đã được ghi).'
        : 'Lỗi kết nối (' + e.message + '). Hãy bấm Thử lại.';
    } finally {
      active--; render(); pump();
    }
  }

  $('list').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const id = Number(b.dataset.id);
    const it = queue.find(x => x.id === id);
    if (!it) return;
    if (b.dataset.act === 'retry') { it.state = 'wait'; render(); pump(); }
    else if (b.dataset.act === 'drop') { sessionKeys.delete(keyOf(it.f)); queue = queue.filter(x => x.id !== id); render(); }
  });

  window.addEventListener('beforeunload', e => {
    if (queue.some(x => x.state === 'wait' || x.state === 'send')) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Xử lý nội dung mã QR ----------
  // Trả về true nếu mã hợp lệ và đã đưa vào hàng đợi lưu
  function handleText(text) {
    const f = parse(text);
    if (!f) { status('✘ Mã QR không đủ ' + FIELD_COUNT + ' trường: ' + text, 'err'); return false; }
    for (const no of DATE_FIELDS) {
      if (!validDate(f[no - 1])) {
        status('✘ Trường ' + no + ' không phải ngày hợp lệ: ' + f[no - 1] + '. Hãy quét lại.', 'err');
        return false;
      }
    }
    const k = keyOf(f);
    if (sessionKeys.has(k)) { status('⚠ Mã này đã quét trong phiên làm việc, không gửi lại.', 'dupc'); return false; }
    sessionKeys.add(k);

    beep();
    status('✔ Đã đọc mã. Bấm Scan QR để quét thẻ tiếp theo.', 'ok');
    queue.push({ id: nextId++, f: f, state: 'wait' });
    render();
    pump();
    return true;
  }

  // ---------- Scan QR: chụp ảnh và đọc mã ----------
  function resizeBlob(file, maxSide) {
    return createImageBitmap(file).then(bmp => new Promise(resolve => {
      const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k);
      c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b), 'image/jpeg', 0.95);
    }));
  }

  function loadViaImg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Không mở được ảnh')); };
      img.src = url;
    });
  }

  function loadBitmap(file) {
    if (window.createImageBitmap) return createImageBitmap(file).catch(() => loadViaImg(file));
    return loadViaImg(file);
  }

  // Bộ đọc có sẵn của hệ thống (Chrome/Android), nếu có
  async function nativeDecode(blob) {
    if (!('BarcodeDetector' in window)) return null;
    try {
      const det = new BarcodeDetector({ formats: ['qr_code'] });
      const bmp = await createImageBitmap(blob);
      const r = await det.detect(bmp);
      return r.length ? r[0].rawValue : null;
    } catch (e) { return null; }
  }

  // Bộ đọc chính: zxing-wasm (đọc tốt hơn và nhanh hơn, dùng được cả trên iPhone)
  async function zxingDecode(bmp) {
    if (typeof ZXingWASM === 'undefined') return null;
    const w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
    const maxDim = Math.max(w, h);
    const sides = [];
    [2000, 1400, 1000, 3200].forEach(s => {
      const v = Math.min(s, maxDim);
      if (sides.indexOf(v) === -1) sides.push(v);
    });
    const opts = { formats: ['QRCode'], tryHarder: true, tryRotate: true, tryInvert: true,
                   tryDownscale: true, maxNumberOfSymbols: 1 };
    for (const side of sides) {
      try {
        const k = side / maxDim;
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(bmp, 0, 0, c.width, c.height);
        const res = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, c.width, c.height), opts);
        const hit = res.find(r => r.isValid && r.text);
        if (hit) return hit.text;
      } catch (e) { return null; }   // không nạp được bộ đọc: dùng cách dự phòng
    }
    return null;
  }

  // Cách dự phòng cuối cùng: html5-qrcode ở nhiều cỡ ảnh
  async function legacyDecode(file) {
    const s = new Html5Qrcode('readerFile', {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    try {
      for (const size of [0, 2000, 1400, 1000, 700, 480]) {
        let blob = file;
        if (size) {
          try { blob = await resizeBlob(file, size); } catch (e) { continue; }
        }
        try {
          const text = await s.scanFile(new File([blob], 'q.jpg', { type: 'image/jpeg' }), false);
          if (text) return text;
        } catch (e) {}
      }
      return null;
    } finally {
      try { s.clear(); } catch (x) {}
    }
  }

  async function decodeFile(file) {
    let text = await nativeDecode(file);
    if (text) return text;
    let bmp = null;
    try { bmp = await loadBitmap(file); } catch (e) {}
    if (bmp) {
      try { text = await zxingDecode(bmp); } finally { if (bmp.close) bmp.close(); }
      if (text) return text;
    }
    return await legacyDecode(file);
  }

  async function processPhoto(file) {
    if (photoBusy) return;
    photoBusy = true;
    $('btnScan').disabled = true;
    status('Đang đọc mã QR từ ảnh...', 'wait');
    let text = null;
    try { text = await decodeFile(file); } catch (e) {}
    photoBusy = false;
    $('btnScan').disabled = false;
    if (!text) {
      status('✘ Không đọc được mã trong ảnh. Hãy bấm Scan QR và chụp lại: để mã QR chiếm khoảng 1/3 khung hình, giữ máy cách 15–25 cm, chạm vào mã để lấy nét, tránh chói sáng.', 'err');
      return;
    }
    handleText(text);
  }

  async function processWebPath(path) {
    const r = await fetch(path);
    await processPhoto(await r.blob());
  }

  // ---------- Camera gốc của Android (app đóng gói bằng Capacitor) ----------
  function nativePlugin(name) {
    try {
      const C = window.Capacitor;
      if (!C || !(C.isNativePlatform && C.isNativePlatform())) return null;
      return (C.Plugins && C.Plugins[name]) || (C.registerPlugin ? C.registerPlugin(name) : null);
    } catch (e) { return null; }
  }
  const NativeCamera = nativePlugin('Camera');
  const NativeApp = nativePlugin('App');

  // Một số máy (ví dụ Honor) đóng app khi mở camera; kết quả ảnh được khôi phục tại đây khi app mở lại
  if (NativeApp) {
    NativeApp.addListener('appRestoredResult', async (res) => {
      if (!res || res.pluginId !== 'Camera' || res.methodName !== 'getPhoto') return;
      if (res.success && res.data && res.data.webPath) {
        status('Đang khôi phục ảnh vừa chụp...', 'wait');
        try { await processWebPath(res.data.webPath); }
        catch (e) { status('✘ Không đọc được ảnh vừa chụp. Hãy bấm Scan QR và chụp lại.', 'err'); }
      } else {
        status('✘ Ảnh vừa chụp bị mất do máy đóng ứng dụng. Hãy bấm Scan QR và chụp lại.', 'err');
      }
    });
  }

  $('btnScan').onclick = async () => {
    if (!apiReady()) { status('Chưa cấu hình URL Apps Script trong config.js.', 'err'); return; }
    if (photoBusy) return;
    if (!NativeCamera) { $('file').click(); return; }   // iPhone / trình duyệt: dùng ô chọn ảnh
    let photo = null;
    try {
      photo = await NativeCamera.getPhoto({ quality: 92, resultType: 'uri', source: 'CAMERA',
        direction: 'REAR', correctOrientation: true, saveToGallery: false, allowEditing: false });
    } catch (e) {
      const m = String((e && e.message) || e);
      if (/cancel/i.test(m)) { status(''); return; }
      if (/denied|permission/i.test(m)) {
        status('✘ Chưa cấp quyền camera. Hãy vào Cài đặt > Ứng dụng > ID Scan > Quyền và bật Camera.', 'err');
        return;
      }
      status('✘ Không mở được camera: ' + m, 'err');
      return;
    }
    if (photo && photo.webPath) {
      try { await processWebPath(photo.webPath); }
      catch (e) { status('✘ Không đọc được ảnh vừa chụp. Hãy bấm Scan QR và chụp lại.', 'err'); }
    }
  };

  $('file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (file) await processPhoto(file);
  });

  // Nạp sẵn bộ đọc để lần quét đầu tiên không bị chậm
  window.addEventListener('load', () => {
    try {
      if (typeof ZXingWASM !== 'undefined') {
        ZXingWASM.readBarcodes(new ImageData(8, 8), { formats: ['QRCode'] }).catch(() => {});
      }
    } catch (e) {}
  });

  $('btnSetup').onclick=doSetup;
  $('btnChangeCompany').onclick=()=>{ if(!confirm('Đổi công ty sẽ xóa phiên đăng nhập trên thiết bị này. Tiếp tục?')) return; token='';tenantId=''; companyName=''; lsSet(LS_TOKEN,'');lsSet(LS_TENANT,'');lsSet(LS_COMPANY,'');showSetup(); }; 
  $('btnSendOtp').onclick = sendOtp;
  $('btnVerify').onclick = verifyOtp;
  $('btnLogout').onclick = logout;
  $('otp').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOtp(); });
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') sendOtp(); });

  // ---------- Khởi động ----------
  (async function init() {
    tenantId=lsGet(LS_TENANT); companyName=lsGet(LS_COMPANY);
    if(!tenantId) { showSetup(); return; }
    token = lsGet(LS_TOKEN); userEmail = lsGet(LS_EMAIL);
    if (!token) { showLogin(); return; }
    try {
      const r = await api({ action: 'check', token: token }, 20000);
      if (r.ok) { userEmail = r.email; showApp(); }
      else showLogin('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.', 'err');
    } catch (e) {
      showApp(); // mất mạng tạm thời: vẫn vào màn hình chính
    }
  })();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
